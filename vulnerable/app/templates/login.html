{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block public_content %}
<div class="auth-card">
  <div class="auth-logo">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="">
    <span class="brand-name">CampusPulse</span>
  </div>
  <h1>Welcome back 👋</h1>
  <p class="subtitle">Sign in to your student portal account.</p>

  <form method="post" class="form">
    <label>Username
      <input name="username" type="text" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>

  <p class="muted center small" style="margin-top: 18px">
    Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>.
  </p>
</div>
{% endblock %}
